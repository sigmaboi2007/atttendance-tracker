<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Attendance Tracker</title>
<style>
:root{--px:clamp(10px,3vw,32px);--bg:#f6f7fb;--card:#fff;--tx:#1b1d27;--mu:#6b7080;--ac:#4f46e5;--ok:#16a34a;--bad:#dc2626;--bd:#e3e5ee;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12131a;--card:#1c1e29;--tx:#eceef6;--mu:#9a9fb2;--ac:#818cf8;--bd:#2c2f3d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12131a;--card:#1c1e29;--tx:#eceef6;--mu:#9a9fb2;--ac:#818cf8;--bd:#2c2f3d;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:clamp(15px,0.4vw + 13.5px,17px)/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;max-width:1280px;margin:0 auto;padding:10px var(--px) 120px;text-align:left}
h1{font-size:19px;margin:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);margin:0 calc(var(--px) * -1) 4px;padding:8px var(--px)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;margin-bottom:8px}
.mu{color:var(--mu);font-size:12px}
.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{flex:1;border:0;background:none;color:var(--mu);padding:13px 4px;font-size:14px;font-weight:600}
.tabs button.on{color:var(--ac)}
button,input,select{font:inherit;color:inherit}
.btn{background:var(--ac);color:#fff;border:0;border-radius:9px;padding:8px 12px;font-weight:600}
.btn.g{background:none;border:1px solid var(--bd);color:var(--tx)}
.row{display:flex;gap:8px;align-items:center}
.sp{justify-content:space-between}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.g3 label{font-size:12px;color:var(--mu);display:block}
input[type=text],input[type=number],input[type=date],select{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px}
.pct{font-weight:700}.ok{color:var(--ok)}.bad{color:var(--bad)}
.bar{height:4px;background:var(--bd);border-radius:4px;overflow:hidden;margin-top:5px}.bar i{display:block;height:100%}
.sr{display:flex;align-items:center;gap:8px;cursor:pointer}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.sr .m{flex:1;min-width:0}.sr b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pal{position:sticky;top:calc(var(--hh,56px) + env(safe-area-inset-top,0px));z-index:5;background:var(--bg);padding:6px 0;display:flex;flex-wrap:wrap;gap:6px}
.chip{touch-action:none;user-select:none;-webkit-user-select:none;color:#fff;border-radius:18px;padding:8px 12px;font-size:13px;font-weight:600;cursor:grab}
.ghost{position:fixed;z-index:99;pointer-events:none;transform:translate(-50%,-120%);opacity:.9;box-shadow:0 4px 14px #0005}
.tg{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.c{flex:1 1 76px;border:1px dashed var(--bd);border-radius:8px;min-height:54px;padding:14px 5px 4px;font-size:12px;text-align:center;position:relative;display:flex;flex-direction:column;justify-content:center}
.c small{font-size:9px;color:var(--mu)}
.c.f{border-style:solid;color:#fff}.c.f small{color:#ffffffcc}
.c.over{outline:2px solid var(--ac);background:var(--bd)}
.c .x{position:absolute;top:0;right:3px;font-size:14px;cursor:pointer}
.c .z{position:absolute;top:1px;left:3px;font-size:12px;cursor:pointer;opacity:.7}
.c.off{background:var(--bd);opacity:.55;border-style:solid}
.back{position:fixed;inset:0;background:#0006;z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:80%;overflow:auto;background:var(--card);border-radius:16px 16px 0 0;padding:12px 12px calc(12px + env(safe-area-inset-bottom,0px));z-index:21;max-width:560px;margin:0 auto}
.pr{display:flex;align-items:center;gap:8px;padding:9px 4px;border-bottom:1px solid var(--bd)}
.pr span{flex:1}.pr input{width:20px;height:20px}.pr .mvb{color:var(--tx);font-size:13px}.pr .mvb:disabled{opacity:.25}body.cred{background:#dfe7ae}body.cred .top{display:none}
.li{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:12px;width:40px;height:40px;z-index:7;display:block}.li svg{width:100%;height:100%;display:block}
.cr{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:16px;min-height:70vh;color:#c62828;font-weight:700;font-size:22px;text-align:center}.cr marquee{width:100%}
.cfab{position:fixed;right:12px;bottom:calc(62px + env(safe-area-inset-bottom,0px));z-index:6;background:var(--card);border:1px solid var(--bd);color:var(--tx);border-radius:20px;padding:8px 14px;font-size:12px;font-weight:600;box-shadow:0 2px 8px #0003}
.sr .hd{touch-action:none;cursor:grab;color:var(--mu);font-size:18px;padding:0 2px;user-select:none;-webkit-user-select:none}.sr.over{outline:2px solid var(--ac)}
.pr .hd{flex:none;touch-action:none;cursor:grab;color:var(--mu);font-size:18px;padding:0 4px;user-select:none;-webkit-user-select:none}
.pr.over{background:var(--bd)}.er{color:var(--bad);font-size:13px;margin:6px 0}
.pw{display:flex;align-items:center;gap:3px}
.tk{border:1px solid var(--bd);background:var(--card);color:var(--mu);border-radius:50%;width:26px;height:26px;font-size:13px;padding:0;flex:none}
.tk.on{background:var(--ok);color:#fff;border-color:var(--ok)}
.sr.dn{opacity:.6;filter:grayscale(1)}
.pr button{border:0;background:none;color:var(--bad);font-size:16px}
.rv{border:1px solid var(--bd);background:none;border-radius:8px;padding:6px 8px;font-size:12px;color:var(--mu);margin-top:6px}
.dc{display:flex;gap:6px;margin-bottom:8px}.dc button{flex:1;border:1px solid var(--bd);background:var(--card);border-radius:9px;padding:8px 4px;font-size:12px;font-weight:600}.dc .on{background:var(--ac);color:#fff;border-color:var(--ac)}
.dh select{width:auto;font-size:12px;padding:4px}
.b{display:flex;gap:6px}
.b button{border:1px solid var(--bd);background:var(--card);border-radius:8px;padding:8px 10px;font-weight:600}
.b .p.on{background:var(--ok);color:#fff;border-color:var(--ok)}
.b .a.on{background:var(--bad);color:#fff;border-color:var(--bad)}
.b .x.on{background:var(--mu);color:#fff;border-color:var(--mu)}
.dl{background:var(--bad);color:#fff;border:0;border-radius:8px;padding:6px 10px;font-weight:600}
#vc{position:fixed;left:12px;bottom:calc(62px + env(safe-area-inset-bottom,0px));z-index:6;display:none;align-items:center;gap:8px;padding:6px 13px;border-radius:20px;font-size:12px;font-weight:600;color:var(--tx);background:linear-gradient(135deg,var(--card),var(--bg));border:1px solid var(--bd);box-shadow:0 2px 10px #0002}
#vc i{width:8px;height:8px;border-radius:50%;background:#16a34a;animation:pl 2s infinite}
@keyframes pl{0%{box-shadow:0 0 0 0 #16a34a99}70%{box-shadow:0 0 0 7px #16a34a00}100%{box-shadow:0 0 0 0 #16a34a00}}
@media(min-width:760px){
#app.g,#app.t,#app.d{display:grid;gap:10px;align-items:start}
#app.g,#app.d{grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}
#app.t{grid-template-columns:repeat(auto-fill,minmax(440px,1fr))}
#app.g .card,#app.t .card,#app.d .card{margin:0}
#app.g>.ov,#app.g>.ef,#app.t>.pal,#app.t>.mu,#app.t>.scn,#app.d>.dc,#app.d>.mu{grid-column:1/-1}
.ef{max-width:560px}
.tabs{justify-content:center}.tabs button{max-width:220px}
}
.sbm{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:6px 9px;font-size:12px;font-weight:600;margin-top:6px}.sbm:disabled{background:var(--bd);color:var(--mu)}.rv:disabled,.b button:disabled{opacity:.45}
</style></head><body>
<div class="top"><h1>Attendance</h1><div class="row"><span class="row" id="act"></span><button class="btn g" id="th" onclick="toggleTheme()" title="Dark / light mode"></button></div></div>
<div id="app"></div>
<input type="file" id="fi" accept="image/*" hidden onchange="scanFile(this)"><div id="vc"><i></i><span></span></div><div class="tabs"><button data-t="sub">Subjects</button><button data-t="tt">Timetable</button><button data-t="today">Today</button><button data-t="credits">Credits</button></div>
<script>
var OWN=false,KEY="attTrackerV3",DAYS=["Mon","Tue","Wed","Thu","Fri","Sat"],COL=["#4f46e5","#0d9488","#d97706","#db2777","#2563eb","#7c3aed","#059669","#dc2626"];
var DEF=["480-540","540-600","630-690","690-750","780-840","840-900","930-990"],DEFP=DEF.concat(["480-600","540-690","840-930","840-990","840-960","840-1020"]);
var S={subs:[],tt:{},marks:{},off:{},ds:{},presets:DEFP.slice()},tab="sub",date=iso(new Date()),ed=null,delMode=false,sheet=null,msg="",ask=null;
try{var r=localStorage.getItem(KEY);if(r)S=JSON.parse(r);else{var o=localStorage.getItem("attTrackerV2");if(o)migrate(JSON.parse(o))}}catch(e){}
["tt","marks","off","ds"].forEach(function(k){S[k]=S[k]||{}});S.presets=S.presets||DEFP.slice();

function resetAll(){
 try{localStorage.removeItem(KEY);localStorage.removeItem("attTrackerV2")}catch(e){}
 S={subs:[],tt:{},marks:{},off:{},ds:{},presets:DEFP.slice()};
 ed=null;delMode=false;sheet=null;msg="";ask=null;tab="sub";
 save();render();
}
function migrate(o){
 S.subs=o.subs||[];var am=o.am||{},M={m0:"480-540",m1:"540-600",m2:"630-690",m3:"690-750"},A={s:"840-930","430":"840-990","4":"840-960","5":"840-1020"};
 function mp(di,x){return M[x]||(x=="a0"?A[am[di]||"s"]:"930-990")}
 for(var di=0;di<6;di++){var m=am[di]||"s";S.ds[di]=DEF.slice(0,5).concat(m=="s"?["840-930","930-990"]:[A[m]])}
 Object.keys(o.tt||{}).forEach(function(k){var p=k.split("_");S.tt[p[0]+"_"+mp(+p[0],p[1])]=o.tt[k]});
 Object.keys(o.marks||{}).forEach(function(k){var p=k.split("_"),di=(new Date(p[0]+"T00:00:00").getDay()+6)%7;S.marks[p[0]+"_"+mp(di,p[1])]=o.marks[k]});
 ["840-990","840-960","840-1020","480-600","540-690"].forEach(function(x){if(S.presets.indexOf(x)<0)S.presets.push(x)});
}
function fixOv(){for(var di=0;di<6;di++){if(!S.ds[di])continue;var r=[];S.ds[di].forEach(function(x){if(r.some(function(y){return ov(y,x)}))drop(di,x);else r.push(x)});S.ds[di]=r}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function iso(d){var m=d.getMonth()+1,x=d.getDate();return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(x<10?"0":"")+x}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function sub(id){return S.subs.filter(function(s){return s.id==id})[0]}
function pct(s){return s.total>0?Math.min(100,s.att/s.total*100):0}
function col(s){return s.total?(pct(s)>=75?"ok":"bad"):""}
function cc(s){return COL[(s.c||0)%8]}
function tm(m){m=+m;var h=Math.floor(m/60),x=m%60;return(h>12?h-12:h)+(x?":"+(x<10?"0":"")+x:"")}
function lab(id){var p=id.split("-");return tm(p[0])+"–"+tm(p[1])}
function cmp(a,b){var x=a.split("-"),y=b.split("-");return(x[0]-y[0])||(x[1]-y[1])}
function slots(di){return(S.ds[di]||DEF).slice()}
function sys(){return window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"}
function applyTheme(){var t=S.theme||sys();document.documentElement.dataset.theme=tab=="credits"?"light":t;document.body.className=tab=="credits"?"cred":"";var b=document.getElementById("th");if(b)b.textContent=t=="dark"?"☀️":"🌙"}
function toggleTheme(){S.theme=(S.theme||sys())=="dark"?"light":"dark";save();render()}
function cbg(s){return s.done?"#8a8fa0":cc(s)}
function cnm(s){return esc(s.name)+(s.done?"<br><small>completed · "+pct(s).toFixed(1)+"%</small>":"")}
function fin(id){var s=sub(id);s.done=!s.done;save();render()}
function conflict(di,id){return slots(di).filter(function(x){return x!=id&&ov(x,id)})[0]}
function dragSlot(e,di,i){e.preventDefault();var cur=null;
 function mvf(ev){var el=document.elementFromPoint(ev.clientX,ev.clientY),r=el&&el.closest&&el.closest(".pr[data-i]");
  if(cur&&cur!=r)cur.classList.remove("over");cur=r;if(r)r.classList.add("over")}
 function up(){document.removeEventListener("pointermove",mvf);document.removeEventListener("pointerup",up);document.removeEventListener("pointercancel",up);
  if(cur&&+cur.dataset.i!=i){var a=slots(di),t=a.splice(i,1)[0];a.splice(+cur.dataset.i,0,t);S.ds[di]=a;save()}render()}
 document.addEventListener("pointermove",mvf);document.addEventListener("pointerup",up);document.addEventListener("pointercancel",up)}
function dragSub(e,i){e.preventDefault();var cur=null;
 function mvf(ev){var el=document.elementFromPoint(ev.clientX,ev.clientY),r=el&&el.closest&&el.closest(".sr[data-si]");
  if(cur&&cur!=r)cur.classList.remove("over");cur=r;if(r)r.classList.add("over")}
 function up(){document.removeEventListener("pointermove",mvf);document.removeEventListener("pointerup",up);document.removeEventListener("pointercancel",up);
  if(cur&&+cur.dataset.si!=i){var t=S.subs.splice(i,1)[0];S.subs.splice(+cur.dataset.si,0,t);save()}render()}
 document.addEventListener("pointermove",mvf);document.addEventListener("pointerup",up);document.addEventListener("pointercancel",up)}
function mv(di,i,d){var a=slots(di),t=a[i];a[i]=a[i+d];a[i+d]=t;S.ds[di]=a;save();render()}
function abbr(n){var w=n.trim().split(/\s+/);return w.length>1?w.map(function(x){return x[0]}).join("").slice(0,4).toUpperCase():n.slice(0,5)}
function need(s){if(!s.total)return"No classes yet";if(pct(s)>=75)return"Can miss "+Math.floor(s.att/0.75-s.total)+" more (75%)";return"Attend next "+Math.ceil(3*s.total-4*s.att)+" for 75%"}
function ov(a,b){var x=a.split("-"),y=b.split("-");return+x[0]<+y[1]&&+y[0]<+x[1]}
function drop(di,id){delete S.tt[di+"_"+id];delete S.off[di+"_"+id]}
function tg(di,id){var cur=slots(di);
 if(cur.indexOf(id)>-1){cur=cur.filter(function(x){return x!=id});drop(di,id)}
 else{if(conflict(di,id))return;cur.push(id)}
 S.ds[di]=cur;save();render()}
function dp(id){ask="p:"+id;render()}
function dpYes(id){S.presets=S.presets.filter(function(x){return x!=id});ask=null;save();render()}
function addCustom(di){
 function mn(v){var m=/^(\d{1,2})(?::(\d{2}))?$/.exec((v||"").trim());if(!m)return-1;var h=+m[1],x=+(m[2]||0);if(h<1||h>12||x>59)return-1;if(h<8)h+=12;return h*60+x}
 var a=mn(document.getElementById("cs").value),b=mn(document.getElementById("ce").value);
 if(a<0||b<=a){msg="Enter a valid start and end time (end after start).";render();return}
 var id=a+"-"+b;
 if(slots(di).indexOf(id)>-1){render();return}
 var c=conflict(di,id);if(c){msg="That overlaps with "+lab(c)+" on this day. Untick it first.";render();return}
 if(S.presets.indexOf(id)<0)S.presets.push(id);
 msg="";tg(di,id)}
function resetDay(di){slots(di).forEach(function(x){if(DEF.indexOf(x)<0)drop(di,x)});delete S.ds[di];save();render()}
function sheetHtml(){
 if(sheet==null)return"";var di=sheet,cur=slots(di),oth=S.presets.filter(function(x){return cur.indexOf(x)<0}).sort(cmp);
 var h='<div class="back" onclick="sheet=null;msg=\'\';ask=null;render()"></div><div class="sheet"><div class="row sp"><b>'+DAYS[di]+' · slots</b><button class="btn g" onclick="sheet=null;msg=\'\';ask=null;render()">Close</button></div>'+
 '<div class="mu" style="margin:6px 0">Untick a slot to remove it from this day. Use the arrows to change the order. A slot that overlaps a ticked one is locked until you untick the clashing one.</div><b style="font-size:13px">On this day</b>';
 if(!cur.length)h+='<div class="mu">No slots yet</div>';
 cur.forEach(function(id,i){h+='<div class="pr" data-i="'+i+'"><span class="hd" onpointerdown="dragSlot(event,'+di+','+i+')">⋮⋮</span><input type="checkbox" checked onchange="tg('+di+',\''+id+'\')"><span>'+lab(id)+'</span><button class="mvb"'+(i?'':' disabled')+' onclick="mv('+di+','+i+',-1)">▲</button><button class="mvb"'+(i<cur.length-1?'':' disabled')+' onclick="mv('+di+','+i+',1)">▼</button></div>'});
 h+='<b style="font-size:13px;display:block;margin-top:10px">Other options</b>';
 oth.forEach(function(id){var c=conflict(di,id);
  h+='<div class="pr"'+(c?' style="opacity:.5"':'')+'><input type="checkbox"'+(c?' disabled':'')+' onchange="tg('+di+',\''+id+'\')"><span>'+lab(id)+(c?' <small class="mu">overlaps '+lab(c)+'</small>':'')+'</span>'+(ask=="p:"+id?'<button onclick="dpYes(\''+id+'\')">Delete?</button><button class="mvb" onclick="ask=null;render()">Cancel</button>':'<button title="Delete this option" onclick="dp(\''+id+'\')">✕</button>')+'</div>'});
 h+=(msg?'<div class="er">'+msg+'</div>':'')+'<div class="mu" style="margin-top:10px">Custom slot: type times like 2:00 to 3:30 (no AM/PM: 8–11 is morning, 12–7 is afternoon). ✕ above deletes an option until you add it back here.</div><div class="row" style="margin:6px 0"><input type="text" inputmode="decimal" id="cs" placeholder="2:00"><span>to</span><input type="text" inputmode="decimal" id="ce" placeholder="3:30"><button class="btn" onclick="addCustom('+di+')">Add</button></div>'+
 '<button class="btn g" style="width:100%;margin-top:6px" onclick="resetDay('+di+')">Reset this day to default slots</button></div>';
 return h}
function render(){
 if(tab=="credits"&&!S.credits)tab="sub";
 var cb=document.querySelector('.tabs button[data-t="credits"]');if(cb)cb.style.display=S.credits?"":"none";
 applyTheme();
 if(tab=="sub"&&!S.subs.length&&ed==null)add(true);
 document.querySelectorAll(".tabs button").forEach(function(b){b.className=b.dataset.t==tab?"on":""});
 var h="",a="";
 if(tab=="sub"){
  if(S.subs.length&&ed==null){
   if(S.subs.length<8)a+='<button class="btn" onclick="add()">+ Add</button>';
   a+='<button class="btn g" onclick="delMode=!delMode;ask=null;render()">'+(delMode?"Finish":"Delete")+'</button>';
   a+=(ask=="reset"
     ?'<button class="dl" onclick="resetAll()">Confirm Reset?</button><button class="btn g" onclick="ask=null;render()">Cancel</button>'
     :'<button class="dl" onclick="ask=\'reset\';render()">Reset All</button>');
  }
  var t=0,at=0;S.subs.forEach(function(s){t+=s.total;at+=s.att});
  var o=t?Math.min(100,at/t*100):0;
  h+='<div class="card row sp ov"><span class="mu">Overall attendance · '+S.subs.length+'/8 subjects</span><span class="pct '+(t?(o>=75?"ok":"bad"):"")+'">'+o.toFixed(2)+'%</span></div>';
  S.subs.forEach(function(s){
   if(s.id==ed){
    h+='<div class="card ef" style="border-color:var(--ac)"><div class="mu">Subject details</div><input type="text" id="nm" placeholder="Subject name" value="'+esc(s.name)+'" oninput="fld('+s.id+',\'name\',this.value)">'+
    '<div class="g3"><div><label>Total classes</label><input type="number" inputmode="numeric" min="0" value="'+s.total+'" oninput="fld('+s.id+',\'total\',this.value)"></div>'+
    '<div><label>Attended</label><input type="number" inputmode="numeric" min="0" value="'+s.att+'" oninput="fld('+s.id+',\'att\',this.value)"></div>'+
    '<div><label>Not attended</label><input type="number" id="na" value="'+Math.max(0,s.total-s.att)+'" disabled></div></div>'+
    '<div class="row sp"><span class="pct" id="pc">'+pct(s).toFixed(1)+'%</span><div class="row">'+(S.subs.length<8?'<button class="btn g" onclick="add()">Next subject →</button>':'')+'<button class="btn" onclick="done()">Done</button></div></div></div>';
   }else{
